; ============================================================================
; cp_map.ini - Channel Point reward name -> zelda3 game verb mapping
; ----------------------------------------------------------------------------
; Loaded by tools/channel_points/cp_listen.py. Matching is CASE-INSENSITIVE
; and whitespace-collapsed ("Arise CHICKEN!!  (athf)" matches "arise chicken!!
; (athf)"). Rewards with no entry here are LOGGED and IGNORED - they never
; reach the game. That is the safe default: add entries one at a time.
;
; VALUE GRAMMAR (per entry):
;   verb                     -> verb, default effect duration
;   verb arg words...        -> verb + arg       e.g.  spawn raven 2
;   verb ... @frames         -> explicit duration in FRAMES (60 = 1 second)
;   verb {input}             -> {input} = the redeemer's typed message text
;                               (sanitized: '|' and control chars stripped,
;                               capped at 40 chars - the game's arg field is
;                               positional on '|', never let raw chat text
;                               shift those fields)
;   -                        -> explicitly disabled (kept visible, never fires)
;
; THIS MAP IS LANE'S REWARD CATALOG (pre-seeded from the owner's Discord
; list) - it is intended content, not a hardcode.  A FRESH DEPLOYMENT starts
; from cp_map.ini.example (empty-but-valid sample) or edits this file freely;
; anything not listed here is logged and ignored.
; ============================================================================
[map]

; --- Arise Chicken!! (ATHF) : Link IS the cucco for the duration ------------
; 'arise' (aliases: chicken/cucco) spawns a cucco riding Link; items and dash
; blocked while active. WORLD VERB: only fires during actual gameplay.
arise chicken!! (athf) = arise

; --- Flashbang the Stream : mirror the screen --------------------------------
flashbang the stream = flip

; --- Duck(s) : ravens near Link (cap 6 per spawn, world verb) ---------------
duck vanishes = spawn raven 2
ducks running in = spawn raven 2
; alternative for "running in" if lane prefers the random-pool word:
;   ducks running in = swarm 2

; --- So Disappointing : rupee tax (instant stat verb) ------------------------
so disappointing = tax 50
; variant reading the amount from the redeemer's message text:
;   so disappointing = tax {input}

; --- Look At Us : confuse (2 screens) + flip at once -------------------------
look at us = party
; NOTE: confuse is measured in SCREEN TRANSITIONS, not seconds (see
; tools/TWITCH_COMMANDS.txt) - party's confuse portion can outlast a boss.

; --- Commence the Jigglin' ---------------------------------------------------
; 'dance' is NOT a game verb - the game would drop it (RESULT ... reason=unknown).
; Mapped to party as the closest thing to jigglng on screen; flip to one of
; these alternates if lane prefers:
;   commence the jigglin' = dance          ; <- INVALID, documented on purpose
;   commence the jigglin' = party @300     ; 5s of party
commence the jigglin' = party

; ============================================================================
; AUTOMATIC rewards (Highlight My Message, Channel Points Message, sub-emote
; unlocks, ...): EventSub identifies these by reward TYPE, not a custom name
; (payload has reward.type; e.g. "send_highlighted_message"). If you want one
; to do something in-game, key the entry on that type string:
;
; send_highlighted_message = -     ; highlight my message: chat-side only, disabled
; single_message_bypass_sub_mode = -   ; channel points message: disabled
;
; Leave them unmapped/disabled unless lane wants chat-spam rewards firing
; game effects on every highlight.
; ============================================================================

; ----------------------------------------------------------------------------
; VALID VERBS (mirror of kVerbs[] in src/twitch.c - the game re-validates):
;   heal hurt mp drain refill rupees tax bombs arrows        (stats; heal/mp/
;     refill/rupees/bombs/arrows are BLOCKED when vs_mode=1)
;   smite clearscreen spawn swarm confuse flip party freeze stun curse root
;   steal rob thief pickpocket speed fast slow ice icefloor illusion bunny
;   fairy deny denyboots arise chicken cucco
; WORLD VERBS (need real gameplay, else dropped): smite clearscreen spawn
;   swarm fairy arise chicken cucco
; DURATION: dur is FRAMES in the drop contract (60 = 1s); 0 = the game's
;   configured effect_secs default. confuse expires by room transitions.
; ----------------------------------------------------------------------------
